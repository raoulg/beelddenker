name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the skill for claude.ai
        run: cd skills && zip -r ../beelddenker.zip beelddenker
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" beelddenker.zip --title "$GITHUB_REF_NAME" --generate-notes
