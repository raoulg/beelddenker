<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img">
<title>Where do you use beelddenker?</title>
<desc>Claude Code installs the plugin with two commands. The Claude app, claude.ai and Codex start by downloading the zip.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.q{font-size:13px}
.ln{stroke:#5F5E5A}.mut{fill:#5F5E5A}
.g{fill:#F1EFE8;stroke:#888780}.gt{fill:#444441}
.p{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.pl{stroke:#534AB7}
.t{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.ts{fill:#0F6E56}
.step{fill:none;stroke:#D3D1C7}
@media (prefers-color-scheme:dark){
.ln{stroke:#B4B2A9}.mut{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}.gt{fill:#D3D1C7}
.p{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#EEEDFE}.pl{stroke:#AFA9EC}
.t{fill:#085041;stroke:#5DCAA5}.tt{fill:#E1F5EE}.ts{fill:#9FE1CB}
.step{stroke:#444441}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="pl" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="g" x="275" y="20" width="250" height="40" rx="8" stroke-width="1"/>
<text class="h gt" x="400" y="45" text-anchor="middle">Where do you use beelddenker?</text>
<path class="ln" d="M400 60 V78 H180 V94" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
<path class="ln" d="M400 78 H560 V94" fill="none" stroke-width="1.2" marker-end="url(#a)"/>

<rect class="t" x="30" y="100" width="300" height="40" rx="8" stroke-width="1"/>
<text class="h tt" x="180" y="125" text-anchor="middle">Claude Code</text>
<rect class="p" x="370" y="100" width="380" height="40" rx="8" stroke-width="1"/>
<text class="h pt" x="560" y="125" text-anchor="middle">Claude app · claude.ai · Codex</text>

<rect class="step" x="30" y="160" width="300" height="44" rx="6"/>
<text class="s tt" x="44" y="178">1  Add the marketplace</text>
<text class="m ts" x="62" y="195">raoulg/beelddenker</text>
<rect class="step" x="30" y="214" width="300" height="44" rx="6"/>
<text class="s tt" x="44" y="232">2  Install the plugin</text>
<text class="m ts" x="62" y="249">beelddenker@beelddenker</text>
<rect class="step" x="30" y="268" width="300" height="44" rx="6"/>
<text class="s tt" x="44" y="286">3  Reload</text>
<text class="m ts" x="62" y="303">/reload-plugins</text>
<rect class="step" x="30" y="322" width="300" height="44" rx="6"/>
<text class="s tt" x="44" y="340">4  Ask for a picture</text>
<text class="m ts" x="62" y="357">/beelddenker:beelddenker</text>

<path class="pl" d="M560 142 V382" fill="none" stroke-width="1.5" marker-end="url(#ap)"/>
<text class="q mut" x="576" y="250">everyone here starts</text>
<text class="q mut" x="576" y="268">with the same zip</text>
</svg>
