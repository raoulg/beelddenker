<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img">
<title>How to install beelddenker</title>
<desc>Three routes. In claude.ai or the Claude app: turn on code execution, download the zip, open Customize, Skills, plus, Create skill, and upload it. In Claude Code: add the marketplace and install the plugin. Anywhere else: unpack the folder into the skills directory.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:13px;font-weight:600}.m{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.q{font-size:12px}
.ln{stroke:#5F5E5A}
.g{fill:#F1EFE8;stroke:#888780}.gt{fill:#444441}.gs{fill:#5F5E5A}
.p{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.t{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.ts{fill:#0F6E56}
.step{fill:none;stroke:#D3D1C7}
@media (prefers-color-scheme:dark){
.ln{stroke:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}.gt{fill:#D3D1C7}.gs{fill:#B4B2A9}
.p{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#EEEDFE}.ps{fill:#CECBF6}
.t{fill:#085041;stroke:#5DCAA5}.tt{fill:#E1F5EE}.ts{fill:#9FE1CB}
.step{stroke:#444441}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="g" x="275" y="20" width="250" height="40" rx="8" stroke-width="1"/>
<text class="h gt" x="400" y="45" text-anchor="middle">Where do you use Claude?</text>
<path class="ln" d="M400 60 V78 H150 V94" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
<path class="ln" d="M400 60 V94" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
<path class="ln" d="M400 78 H650 V94" fill="none" stroke-width="1.2" marker-end="url(#a)"/>

<rect class="p" x="30" y="100" width="240" height="40" rx="8" stroke-width="1"/>
<text class="h pt" x="150" y="125" text-anchor="middle">claude.ai · Claude app</text>
<rect class="t" x="280" y="100" width="240" height="40" rx="8" stroke-width="1"/>
<text class="h tt" x="400" y="125" text-anchor="middle">Claude Code</text>
<rect class="g" x="530" y="100" width="240" height="40" rx="8" stroke-width="1"/>
<text class="h gt" x="650" y="125" text-anchor="middle">Any other agent</text>

<rect class="step" x="30" y="160" width="240" height="44" rx="6"/>
<text class="s pt" x="44" y="178">1  Turn on code execution</text>
<text class="q ps" x="62" y="195">Settings › Capabilities</text>
<rect class="step" x="30" y="214" width="240" height="44" rx="6"/>
<text class="s pt" x="44" y="232">2  Download the zip</text>
<text class="q ps" x="62" y="249">Releases › beelddenker.zip</text>
<rect class="step" x="30" y="268" width="240" height="44" rx="6"/>
<text class="s pt" x="44" y="286">3  Open Customize › Skills</text>
<text class="q ps" x="62" y="303">+ › Create skill</text>
<rect class="step" x="30" y="322" width="240" height="44" rx="6"/>
<text class="s pt" x="44" y="340">4  Upload a skill</text>
<text class="q ps" x="62" y="357">choose beelddenker.zip</text>

<rect class="step" x="280" y="160" width="240" height="44" rx="6"/>
<text class="s tt" x="294" y="178">1  Add the marketplace</text>
<text class="m ts" x="312" y="195">raoulg/beelddenker</text>
<rect class="step" x="280" y="214" width="240" height="44" rx="6"/>
<text class="s tt" x="294" y="232">2  Install the plugin</text>
<text class="m ts" x="312" y="249">beelddenker@beelddenker</text>
<rect class="step" x="280" y="268" width="240" height="44" rx="6"/>
<text class="s tt" x="294" y="286">3  Reload</text>
<text class="m ts" x="312" y="303">/reload-plugins</text>
<rect class="step" x="280" y="322" width="240" height="44" rx="6"/>
<text class="s tt" x="294" y="340">4  Ask for a picture</text>
<text class="m ts" x="312" y="357">/beelddenker:beelddenker</text>

<rect class="step" x="530" y="160" width="240" height="44" rx="6"/>
<text class="s gt" x="544" y="178">1  Download the zip</text>
<text class="q gs" x="562" y="195">or clone the repository</text>
<rect class="step" x="530" y="214" width="240" height="44" rx="6"/>
<text class="s gt" x="544" y="232">2  Unpack the folder into</text>
<text class="m gs" x="562" y="249">~/.claude/skills/</text>
<rect class="step" x="530" y="268" width="240" height="44" rx="6"/>
<text class="s gt" x="544" y="286">3  Start a new session</text>
<text class="q gs" x="562" y="303">the skill loads by itself</text>
<rect class="step" x="530" y="322" width="240" height="44" rx="6"/>
<text class="s gt" x="544" y="340">4  Ask for a picture</text>
<text class="m gs" x="562" y="357">/beelddenker</text>
</svg>
