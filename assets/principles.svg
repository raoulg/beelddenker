<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img">
<title>Eight of the fifteen visual principles</title>
<desc>Top row, exact principles: flow, function or pipeline, commuting diagram, group action. Bottom row, poetic principles: tension field, metamorphosis, landscape or journey, constellation.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:13px}.xs{font-size:11px}.big{font-size:20px}
.ink{fill:#2C2C2A}.mut{fill:#5F5E5A}.ln{stroke:#5F5E5A}
.tile{fill:none;stroke:#D3D1C7}
.g{fill:#F1EFE8;stroke:#888780}.gt{fill:#444441}
.p{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.pl{stroke:#534AB7}.pf{fill:#534AB7}
.t{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.tf{fill:#1D9E75}
.c{fill:#FAECE7;stroke:#993C1D}.ct{fill:#712B13}.cl{stroke:#D85A30}.cf{fill:#D85A30}
.hill{fill:#F1EFE8;stroke:#B4B2A9}.faint{stroke:#B4B2A9}
@media (prefers-color-scheme:dark){
.ink{fill:#E8E6DF}.mut{fill:#B4B2A9}.ln{stroke:#B4B2A9}
.tile{stroke:#444441}
.g{fill:#2C2C2A;stroke:#888780}.gt{fill:#D3D1C7}
.p{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#EEEDFE}.pl{stroke:#AFA9EC}.pf{fill:#AFA9EC}
.t{fill:#085041;stroke:#5DCAA5}.tt{fill:#E1F5EE}.tf{fill:#5DCAA5}
.c{fill:#712B13;stroke:#F0997B}.ct{fill:#FAECE7}.cl{stroke:#F0997B}.cf{fill:#F0997B}
.hill{fill:#2C2C2A;stroke:#5F5E5A}.faint{stroke:#5F5E5A}}
</style>
