<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img">
<title>Example: should we cache this API call?</title>
<desc>Left, the answer as a block of text. Right, the same answer as a commuting square: fetching and rendering equals looking up the cache and rendering, but only while the cache is fresh.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.s{font-size:13px}.m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.big{font-size:30px;font-weight:600}
.ink{fill:#2C2C2A}.mut{fill:#5F5E5A}.ln{stroke:#5F5E5A}.bar{fill:#D3D1C7}
.g{fill:#F1EFE8;stroke:#888780}.gt{fill:#444441}
.p{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}
.t{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}
.r{fill:#A32D2D}
@media (prefers-color-scheme:dark){
.ink{fill:#E8E6DF}.mut{fill:#B4B2A9}.ln{stroke:#B4B2A9}.bar{fill:#444441}
.g{fill:#2C2C2A;stroke:#888780}.gt{fill:#D3D1C7}
.p{fill:#3C3489;stroke:#AFA9EC}.pt{fill:#EEEDFE}
.t{fill:#085041;stroke:#5DCAA5}.tt{fill:#E1F5EE}
.r{fill:#F09595}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text class="h ink" x="30" y="40">Before: the answer as text</text>
<rect class="bar" x="30" y="60" width="280" height="7" rx="3"/>
<rect class="bar" x="30" y="76" width="262" height="7" rx="3"/>
<rect class="bar" x="30" y="92" width="290" height="7" rx="3"/>
<rect class="bar" x="30" y="108" width="214" height="7" rx="3"/>
<rect class="bar" x="30" y="132" width="276" height="7" rx="3"/>
<rect class="bar" x="30" y="148" width="288" height="7" rx="3"/>
<rect class="bar" x="30" y="164" width="250" height="7" rx="3"/>
<rect class="bar" x="30" y="180" width="270" height="7" rx="3"/>
<rect class="bar" x="30" y="196" width="160" height="7" rx="3"/>
<rect class="bar" x="30" y="220" width="284" height="7" rx="3"/>
<rect class="bar" x="30" y="236" width="266" height="7" rx="3"/>
<rect class="bar" x="30" y="252" width="290" height="7" rx="3"/>
<rect class="bar" x="30" y="268" width="232" height="7" rx="3"/>
<rect class="bar" x="30" y="292" width="278" height="7" rx="3"/>
<rect class="bar" x="30" y="308" width="196" height="7" rx="3"/>
<text class="m mut" x="370" y="178" text-anchor="middle">/beelddenker</text>
<line class="ln" x1="336" y1="190" x2="402" y2="190" stroke-width="1.5" marker-end="url(#a)"/>
<text class="h ink" x="430" y="40">After: the answer as a picture</text>
<rect class="g" x="430" y="80" width="120" height="40" rx="8" stroke-width="1"/>
<text class="h gt" x="490" y="105" text-anchor="middle">request</text>
<rect class="p" x="650" y="80" width="120" height="40" rx="8" stroke-width="1"/>
<text class="h pt" x="710" y="105" text-anchor="middle">origin data</text>
<rect class="t" x="430" y="250" width="120" height="40" rx="8" stroke-width="1"/>
<text class="h tt" x="490" y="275" text-anchor="middle">cached copy</text>
<rect class="g" x="650" y="250" width="120" height="40" rx="8" stroke-width="1"/>
<text class="h gt" x="710" y="275" text-anchor="middle">response</text>
<text class="s mut" x="599" y="92" text-anchor="middle">fetch</text>
<line class="ln" x1="552" y1="100" x2="644" y2="100" stroke-width="1.2" marker-end="url(#a)"/>
<text class="s mut" x="480" y="190" text-anchor="end">lookup</text>
<line class="ln" x1="490" y1="122" x2="490" y2="244" stroke-width="1.2" marker-end="url(#a)"/>
<text class="s mut" x="720" y="190">render</text>
<line class="ln" x1="710" y1="122" x2="710" y2="244" stroke-width="1.2" marker-end="url(#a)"/>
<line class="ln" x1="552" y1="270" x2="644" y2="270" stroke-width="1.2" marker-end="url(#a)"/>
<text class="s mut" x="599" y="288" text-anchor="middle">render</text>
<text class="big r" x="600" y="200" text-anchor="middle">≈</text>
<text class="s r" x="600" y="326" text-anchor="middle">≈ the square commutes only while the cache is fresh</text>
<text class="s mut" x="600" y="348" text-anchor="middle">so the real question is: how stale may a response be?</text>
</svg>
